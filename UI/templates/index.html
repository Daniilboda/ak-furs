<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AK Furs — обработка выгрузок</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <header class="top">
    <p class="brand">AK Furs</p>
    <p class="tag">Обработка выгрузок ателье</p>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1>Загрузите сырые файлы</h1>
      <p class="lead">CRM, банковская выписка, каталог цен и архив чатов — затем одна кнопка запустит расчёт.</p>
    </section>

    <form id="upload-form" class="upload-grid">
      <label class="drop" data-key="crm">
        <input type="file" name="crm" accept=".csv,text/csv" hidden />
        <span class="drop-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M12 16V4m0 0l-3.5 3.5M12 4l3.5 3.5"/>
            <path d="M4 14v4.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V14"/>
          </svg>
        </span>
        <span class="drop-title">CRM</span>
        <span class="drop-hint">CSV · перетащите или нажмите</span>
        <span class="drop-file" data-filename></span>
      </label>

      <label class="drop" data-key="bank">
        <input type="file" name="bank" accept=".csv,text/csv" hidden />
        <span class="drop-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M12 16V4m0 0l-3.5 3.5M12 4l3.5 3.5"/>
            <path d="M4 14v4.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V14"/>
          </svg>
        </span>
        <span class="drop-title">Выписка</span>
        <span class="drop-hint">CSV · банк</span>
        <span class="drop-file" data-filename></span>
      </label>

      <label class="drop" data-key="catalog">
        <input type="file" name="catalog" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />
        <span class="drop-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M12 16V4m0 0l-3.5 3.5M12 4l3.5 3.5"/>
            <path d="M4 14v4.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V14"/>
          </svg>
        </span>
        <span class="drop-title">Каталог</span>
        <span class="drop-hint">XLSX · прайс и менеджеры</span>
        <span class="drop-file" data-filename></span>
      </label>

      <label class="drop" data-key="chats">
        <input type="file" name="chats" accept=".zip,application/zip" hidden />
        <span class="drop-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M12 16V4m0 0l-3.5 3.5M12 4l3.5 3.5"/>
            <path d="M4 14v4.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V14"/>
          </svg>
        </span>
        <span class="drop-title">Чаты</span>
        <span class="drop-hint">ZIP · переписки</span>
        <span class="drop-file" data-filename></span>
      </label>
    </form>

    <div class="actions">
      <button type="button" id="run-btn" class="btn-primary" disabled>
        Запустить python solve.py
      </button>
      <p id="status" class="status" role="status"></p>
    </div>

    <section id="results" class="results hidden">
      <h2>Результаты</h2>
      <ul id="main-files" class="file-list"></ul>

      <h3>Дополнительные файлы</h3>
      <ul id="extra-files" class="file-list secondary"></ul>
    </section>
  </main>

  <footer class="foot">
    <span>AK Furs · меховое ателье</span>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
